<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Level Revise - Free Revision Notes</title>
  <meta name="description" content="Free A-Level revision notes for all subjects and exam boards.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      
      <nav class="site-nav" aria-label="Main navigation">
        <a href="#subjects">Subjects</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Free A-Level Revision Notes</h1>
      <p class="subtitle">Select a subject and exam board below.</p>
    </section>

    <section class="site-section" id="subjects">
      <h2>Subjects</h2>
      <div id="subjects-grid" class="subjects-grid"></div>
    </section>

    <section class="site-section" id="about">
      <h2>About A-Level Revise</h2>
      <p>Comprehensive revision notes for AQA, Edexcel, OCR, WJEC, and CCEA A‑Level subjects. All content is client‑side, private, and free.</p>
    </section>
  </main>

  <script src="subjects.json" type="application/json"></script>
  <script>
    const data = JSON.parse(document.querySelector('script[src="subjects.json"]').textContent);
    const grid = document.getElementById('subjects-grid');

    data.subjects.forEach(subject => {
      subject.boards.forEach(board => {
        const boardDiv = document.createElement('div');
        boardDiv.className = 'board-card';

        const boardTitle = document.createElement('h3');
        boardTitle.textContent = `${subject.name} – ${board.board}`;
        if (board.topics && board.topics.length > 0) {
          boardTitle.textContent += ` (${board.topics.length} topics)`;
        }

        const topicList = document.createElement('ul');
        if (board.topics && board.topics.length > 0) {
          board.topics.slice(0, 3).forEach(topic => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = topic.page;
            a.textContent = topic.title;
            li.appendChild(a);
            topicList.appendChild(li);
          });
          if (board.topics.length > 3) {
            const more = document.createElement('li');
            more.textContent = `+${board.topics.length - 3} more`;
            topicList.appendChild(more);
          }
        } else {
          const li = document.createElement('li');
          li.textContent = 'No topics loaded yet';
          topicList.appendChild(li);
        }

        boardDiv.appendChild(boardTitle);
        boardDiv.appendChild(topicList);
        grid.appendChild(boardDiv);
      });
    });
  </script>
</body>
</html>

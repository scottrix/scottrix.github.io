<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A-Level Revise - Free Revision Notes</title>
  <meta name="description" content="Free A-Level revision notes for all subjects and exam boards.">
  <link rel="stylesheet" href="style.css"><style>.page-title{text-align:center;margin:1rem 0;font-size:2rem;color:var(--accent);}</style>
</head>
<body>
  <header class="site-header">
    <div class="header-content">
      
      <nav class="nav" aria-label="Main navigation">
        <a href="#subjects">Subjects</a>
        <a href="#about">About</a>
      </nav>
    </div>
  </header>

  <main>
    
<section class="hero">

    <h1>Free A-Level Revision Notes</h1>
    <p class="subtitle">Explore all subjects and exam boards</p>

    </section>

    <section class="site-section" id="subjects">
      <h2>Subjects</h2>
      <div id="subjects-grid" class="subjects-grid"></div>
    </section>

    <section class="site-section" id="about">
      <h2>About A-Level Revise</h2>
      <p>Comprehensive revision notes for AQA, Edexcel, OCR, WJEC, and CCEA A‑Level subjects. All content is client‑side, private, and free.</p>
    </section>
  </main>

  <script>
    fetch('subjects.json')
      .then(res => res.json())
      .then(data => {
        const grid = document.getElementById('subjects-grid');
        data.subjects.forEach(subject => {
  const subjectDiv = document.createElement('div');
  subjectDiv.className = 'subject-card';

  const a = document.createElement('a');
  a.href = `${subject.name.toLowerCase().replace(/\\s+/g,'-')}.html`;
  a.textContent = subject.name;
  subjectDiv.appendChild(a);

  const topicCount = document.createElement('p');
  const total = subject.boards.reduce((sum, board) => sum + (board.topics? board.topics.length : 0), 0);
  topicCount.textContent = `${total} topics`;
  subjectDiv.appendChild(topicCount);

  grid.appendChild(subjectDiv);
});
      })
      .catch(err => console.error('Failed to load subjects:', err));
  </script>
</body>
</html>
